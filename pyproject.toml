[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrnet-avss"
version = "1.0.0"
description = "Controllable Cross-Modal Consistency Repair for Audio-Visual Speech Separation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "pytorch-lightning>=2.2",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "einops>=0.7",
  "rich>=13.0",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["look2hear*"]
